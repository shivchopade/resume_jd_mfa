# nginx config for the frontend container
server {
    listen 80;
    server_name _;

    # The static frontend (index.html, styles.css, app.js)
    root /usr/share/nginx/html;
    index index.html;

    # Allow large uploads: up to 50 resumes x 5 MB each
    client_max_body_size 260m;

    # Every /api/... request goes to the backend container ("backend" = service name
    # in docker-compose.yml). The path is passed through unchanged.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;  # scoring many resumes with an LLM can take a while
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
